<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#06111F" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font:850 78px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .subtitle{font:500 32px Inter,Segoe UI,Arial,sans-serif;fill:#59677B}
      .cardTitle{font:850 34px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .cardText{font:610 25px Inter,Segoe UI,Arial,sans-serif;fill:#5A687A}
      .num{font:900 42px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F8FAFD"/>
  <text x="116" y="132" class="title">Why Solana</text>
  <text x="120" y="182" class="subtitle">A children's savings ritual only works if the infrastructure is fast, cheap, mobile, and invisible to families.</text>

  <g filter="url(#shadow)">
    <rect x="136" y="304" width="300" height="430" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <circle cx="286" cy="402" r="54" fill="#3C7BEA"/>
    <text x="286" y="416" class="num" text-anchor="middle">1</text>
    <text x="286" y="508" class="cardTitle" text-anchor="middle">Instant feel</text>
    <text x="286" y="560" class="cardText" text-anchor="middle">Family moments</text>
    <text x="286" y="592" class="cardText" text-anchor="middle">cannot feel like</text>
    <text x="286" y="624" class="cardText" text-anchor="middle">banking chores.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="480" y="304" width="300" height="430" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <circle cx="630" cy="402" r="54" fill="#28A86B"/>
    <text x="630" y="416" class="num" text-anchor="middle">2</text>
    <text x="630" y="508" class="cardTitle" text-anchor="middle">Tiny fees</text>
    <text x="630" y="560" class="cardText" text-anchor="middle">A small tooth gift</text>
    <text x="630" y="592" class="cardText" text-anchor="middle">has to stay</text>
    <text x="630" y="624" class="cardText" text-anchor="middle">economical.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="824" y="304" width="300" height="430" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <circle cx="974" cy="402" r="54" fill="#7C5CFF"/>
    <text x="974" y="416" class="num" text-anchor="middle">3</text>
    <text x="974" y="508" class="cardTitle" text-anchor="middle">cNFT scale</text>
    <text x="974" y="560" class="cardText" text-anchor="middle">Keepsakes can be</text>
    <text x="974" y="592" class="cardText" text-anchor="middle">minted as real</text>
    <text x="974" y="624" class="cardText" text-anchor="middle">consumer artifacts.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1168" y="304" width="300" height="430" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <circle cx="1318" cy="402" r="54" fill="#DF6D8F"/>
    <text x="1318" y="416" class="num" text-anchor="middle">4</text>
    <text x="1318" y="508" class="cardTitle" text-anchor="middle">Mobile-native</text>
    <text x="1318" y="560" class="cardText" text-anchor="middle">Parents and</text>
    <text x="1318" y="592" class="cardText" text-anchor="middle">relatives live</text>
    <text x="1318" y="624" class="cardText" text-anchor="middle">on phones.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1512" y="304" width="300" height="430" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <circle cx="1662" cy="402" r="54" fill="#E8A52E"/>
    <text x="1662" y="416" class="num" text-anchor="middle">5</text>
    <text x="1662" y="508" class="cardTitle" text-anchor="middle">Portable actions</text>
    <text x="1662" y="560" class="cardText" text-anchor="middle">Gift links and</text>
    <text x="1662" y="592" class="cardText" text-anchor="middle">Blinks turn sharing</text>
    <text x="1662" y="624" class="cardText" text-anchor="middle">into conversion.</text>
  </g>

  <rect x="216" y="826" width="1488" height="94" rx="28" fill="#182033"/>
  <text x="960" y="884" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="33" font-weight="800" fill="#FFFFFF" text-anchor="middle">Sticky Solana accounts can start with family milestones.</text>
</svg>
