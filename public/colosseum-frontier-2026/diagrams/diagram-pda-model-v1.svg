<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05101C" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M2 2L16 9L2 16" fill="none" stroke="#415064" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:800 72px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .subtitle{font:500 31px Inter,Segoe UI,Arial,sans-serif;fill:#59677B}
      .nodeTitle{font:850 34px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .nodeText{font:620 23px Inter,Segoe UI,Arial,sans-serif;fill:#5A687A}
      .code{font:700 20px Consolas,Menlo,monospace;fill:#4A5568}
      .line{stroke:#415064;stroke-width:5;marker-end:url(#arrow);opacity:.76}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FBFCFF"/>
  <text x="116" y="124" class="title">Anchor account model</text>
  <text x="120" y="172" class="subtitle">Family savings state is modeled around guardian control, child milestones, deposits, and a treasury path.</text>

  <g filter="url(#shadow)">
    <rect x="112" y="322" width="306" height="164" rx="30" fill="#EAF4FF" stroke="#8CB8EE" stroke-width="3"/>
    <text x="265" y="385" class="nodeTitle" text-anchor="middle">Guardian wallet</text>
    <text x="265" y="425" class="nodeText" text-anchor="middle">signs setup and</text>
    <text x="265" y="455" class="nodeText" text-anchor="middle">family actions</text>
  </g>
  <line x1="418" y1="404" x2="552" y2="404" class="line"/>
  <g filter="url(#shadow)">
    <rect x="558" y="310" width="328" height="188" rx="30" fill="#EEFDF5" stroke="#67D391" stroke-width="3"/>
    <text x="722" y="370" class="nodeTitle" text-anchor="middle">Child profile PDA</text>
    <text x="722" y="412" class="nodeText" text-anchor="middle">child identity and</text>
    <text x="722" y="442" class="nodeText" text-anchor="middle">guardian authority</text>
    <text x="722" y="477" class="code" text-anchor="middle">seed: child_profile</text>
  </g>
  <line x1="886" y1="404" x2="1022" y2="404" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1028" y="310" width="328" height="188" rx="30" fill="#FFF3D5" stroke="#F4BD4A" stroke-width="3"/>
    <text x="1192" y="370" class="nodeTitle" text-anchor="middle">Milestone PDA</text>
    <text x="1192" y="412" class="nodeText" text-anchor="middle">lost tooth event,</text>
    <text x="1192" y="442" class="nodeText" text-anchor="middle">metadata, status</text>
    <text x="1192" y="477" class="code" text-anchor="middle">seed: milestone</text>
  </g>
  <line x1="1356" y1="404" x2="1490" y2="404" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1496" y="310" width="312" height="188" rx="30" fill="#F0EDFF" stroke="#9077FF" stroke-width="3"/>
    <text x="1652" y="370" class="nodeTitle" text-anchor="middle">Treasury PDA</text>
    <text x="1652" y="412" class="nodeText" text-anchor="middle">program-owned</text>
    <text x="1652" y="442" class="nodeText" text-anchor="middle">savings route</text>
    <text x="1652" y="477" class="code" text-anchor="middle">seed: treasury</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="668" width="332" height="164" rx="30" fill="#FFEFF5" stroke="#E88AA8" stroke-width="3"/>
    <text x="548" y="731" class="nodeTitle" text-anchor="middle">Gift giver</text>
    <text x="548" y="771" class="nodeText" text-anchor="middle">opens a family link</text>
    <text x="548" y="801" class="nodeText" text-anchor="middle">and sends funds</text>
  </g>
  <line x1="704" y1="668" x2="1044" y2="500" class="line"/>
  <g filter="url(#shadow)">
    <rect x="822" y="640" width="378" height="220" rx="34" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <text x="1011" y="708" class="nodeTitle" text-anchor="middle">Deposit instruction</text>
    <text x="1011" y="750" class="nodeText" text-anchor="middle">validates milestone state</text>
    <text x="1011" y="780" class="nodeText" text-anchor="middle">and records contribution</text>
    <text x="1011" y="818" class="code" text-anchor="middle">instruction: deposit_to_tooth</text>
  </g>
  <line x1="1200" y1="750" x2="1514" y2="504" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1306" y="668" width="332" height="164" rx="30" fill="#E8FAFE" stroke="#56CFE1" stroke-width="3"/>
    <text x="1472" y="731" class="nodeTitle" text-anchor="middle">Child wallet</text>
    <text x="1472" y="771" class="nodeText" text-anchor="middle">future ownership</text>
    <text x="1472" y="801" class="nodeText" text-anchor="middle">and family proof</text>
  </g>
  <line x1="1356" y1="732" x2="1214" y2="506" class="line"/>

  <rect x="116" y="944" width="1688" height="72" rx="22" fill="#182033"/>
  <text x="960" y="990" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#FFFFFF" text-anchor="middle">The technical story: low-friction family deposits, explicit account state, and proof that survives beyond one web session.</text>
</svg>
