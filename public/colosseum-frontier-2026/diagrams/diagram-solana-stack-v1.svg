<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#071120" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M2 2L16 9L2 16" fill="none" stroke="#4F5B70" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:800 74px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .subtitle{font:500 32px Inter,Segoe UI,Arial,sans-serif;fill:#59677B}
      .layer{font:850 38px Inter,Segoe UI,Arial,sans-serif;fill:#182033}
      .text{font:620 25px Inter,Segoe UI,Arial,sans-serif;fill:#59677B}
      .chip{font:800 24px Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .line{stroke:#4F5B70;stroke-width:5;marker-end:url(#arrow);opacity:.76}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#F8FAFD"/>
  <text x="116" y="128" class="title">Solana under the magic</text>
  <text x="120" y="178" class="subtitle">The product feels like a family ritual. Underneath, it is a portable Solana savings and keepsake system.</text>

  <g filter="url(#shadow)">
    <rect x="166" y="266" width="1588" height="124" rx="30" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="3"/>
    <text x="224" y="342" class="layer">Tanda UX</text>
    <text x="514" y="323" class="text">child profile</text>
    <text x="736" y="323" class="text">lost tooth milestone</text>
    <text x="1058" y="323" class="text">family gift link</text>
    <text x="1364" y="323" class="text">keepsake preview</text>
  </g>
  <line x1="960" y1="390" x2="960" y2="455" class="line"/>
  <g filter="url(#shadow)">
    <rect x="166" y="456" width="1588" height="124" rx="30" fill="#EAF4FF" stroke="#8CB8EE" stroke-width="3"/>
    <text x="224" y="532" class="layer">App + API</text>
    <text x="514" y="513" class="text">Next.js pages</text>
    <text x="736" y="513" class="text">upload route</text>
    <text x="1058" y="513" class="text">mint route</text>
    <text x="1364" y="513" class="text">gift route</text>
  </g>
  <line x1="960" y1="580" x2="960" y2="645" class="line"/>
  <g filter="url(#shadow)">
    <rect x="166" y="646" width="1588" height="154" rx="30" fill="#F0EDFF" stroke="#9077FF" stroke-width="3"/>
    <text x="224" y="738" class="layer">Solana</text>
    <rect x="514" y="690" width="214" height="66" rx="20" fill="#FFFFFF"/>
    <text x="621" y="733" class="chip" text-anchor="middle">Anchor escrow</text>
    <rect x="780" y="690" width="194" height="66" rx="20" fill="#FFFFFF"/>
    <text x="877" y="733" class="chip" text-anchor="middle">PDAs</text>
    <rect x="1026" y="690" width="214" height="66" rx="20" fill="#FFFFFF"/>
    <text x="1133" y="733" class="chip" text-anchor="middle">cNFT keepsake</text>
    <rect x="1292" y="690" width="214" height="66" rx="20" fill="#FFFFFF"/>
    <text x="1399" y="733" class="chip" text-anchor="middle">Actions / Blinks</text>
  </g>
  <line x1="960" y1="800" x2="960" y2="865" class="line"/>
  <g filter="url(#shadow)">
    <rect x="166" y="866" width="758" height="124" rx="30" fill="#EEFDF5" stroke="#67D391" stroke-width="3"/>
    <text x="224" y="942" class="layer">Storage</text>
    <text x="514" y="923" class="text">Arweave / Irys metadata</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="996" y="866" width="758" height="124" rx="30" fill="#FFF3D5" stroke="#F4BD4A" stroke-width="3"/>
    <text x="1054" y="942" class="layer">Wallets</text>
    <text x="1344" y="923" class="text">Phantom, mobile wallet flows</text>
  </g>
  <path d="M960 862C960 832 710 832 600 862" stroke="#4F5B70" stroke-width="5" marker-end="url(#arrow)" opacity=".76"/>
  <path d="M960 862C960 832 1210 832 1320 862" stroke="#4F5B70" stroke-width="5" marker-end="url(#arrow)" opacity=".76"/>

  <rect x="116" y="1018" width="1688" height="2" fill="#DEE6F0"/>
</svg>
