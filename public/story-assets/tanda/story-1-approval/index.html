<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tanda Story 1 Approval Pack</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101419;
      --ink: #fff7eb;
      --muted: #d7c5a7;
      --line: rgba(255, 255, 255, 0.14);
      --panel: rgba(255, 255, 255, 0.06);
      --gold: #f2c66d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }

    header,
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding-inline: 22px;
    }

    header {
      padding: 54px 22px 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .dek {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 19px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #f7e2b7;
    }

    .meta span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--panel);
    }

    main {
      padding-bottom: 80px;
    }

    h2 {
      margin: 42px 0 8px;
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 0;
    }

    .scene {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
      gap: 22px;
      align-items: center;
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }

    .frame {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      overflow: hidden;
      border-radius: 8px;
      background: #192027;
    }

    .frame img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 88vh;
      object-fit: contain;
      background: #192027;
    }

    .copy {
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--gold);
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 18px;
    }

    p:last-child {
      margin-bottom: 0;
    }

    code {
      color: #ffe0a0;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    @media (max-width: 820px) {
      .scene {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tanda Story 1<br />Approval Pack</h1>
    <p class="dek">Character sheets and six key scenes for the modern Network origin before the full 32-frame production pass.</p>
    <div class="meta">
      <span>5 character/world sheets</span>
      <span>6 key-scene frames</span>
      <span>Story 1 only</span>
    </div>
  </header>

  <main>
    <h2>Character Sheets</h2>
    <div id="characters"></div>

    <h2>Key Scenes</h2>
    <div id="scenes"></div>
  </main>

  <script>
    const characters = [
      {
        n: "C1",
        title: "Tanda, Network Leader",
        image: "characters/s1-char-tanda-leader-sheet.png",
        note: "Story 2 identity lock: brown curls, warm eyes, iridescent wings, tooth pendant, white dress, brown satchel."
      },
      {
        n: "C2",
        title: "Elias, Age 6",
        image: "characters/s1-char-elias-sheet.png",
        note: "Funny, practical child lead with the space pajamas, missing tooth, and self-owned note."
      },
      {
        n: "C3",
        title: "Dad, Family Anchor",
        image: "characters/s1-char-dad-sheet.png",
        note: "Warm, tired, loving bedtime presence. Helps without taking over."
      },
      {
        n: "C4",
        title: "The Old Forgetting",
        image: "characters/s1-antagonist-old-forgetting-sheet.png",
        note: "Small, fussy, metaphorical threat. It nibbles unnamed details, not teeth."
      },
      {
        n: "C5",
        title: "Collector Teasers",
        image: "characters/s1-collector-teaser-sheet.png",
        note: "First glimpse of the wider universe: distinct collectors and signals, connected without being flattened."
      }
    ];

    const scenes = [
      {
        n: "K1",
        title: "Dinner Tooth Moment",
        image: "key-scenes/s1-key-01-dinner-tooth.png",
        note: "Reality layer: corn, surprise, dad trying not to laugh, the tooth as a tiny real object."
      },
      {
        n: "K2",
        title: "Elias Writes The Note",
        image: "key-scenes/s1-key-02-tooth-note.png",
        note: "The story seed: Elias insists on his own words, even if spelling is messy."
      },
      {
        n: "K3",
        title: "Professional Entrance",
        image: "key-scenes/s1-key-03-tanda-mobile-bump.png",
        note: "Tanda is graceful and capable, with a little bedtime comedy."
      },
      {
        n: "K4",
        title: "The Dull Bite",
        image: "key-scenes/s1-key-04-dull-bite.png",
        note: "The first visible threat: the specific memory is nibbled before the tooth itself."
      },
      {
        n: "K5",
        title: "The Unread Satchel",
        image: "key-scenes/s1-key-05-unread-satchel.png",
        note: "Tanda sees the real wound: too many half-kept promises waiting in her satchel."
      },
      {
        n: "K6",
        title: "The First Invitations",
        image: "key-scenes/s1-key-06-first-invitations.png",
        note: "The universe opens: Tanda becomes leader by inviting existing collectors into one promise."
      }
    ];

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function render(item) {
      return `
        <section class="scene">
          <div class="frame"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.n + ". " + item.title)}" /></div>
          <div class="copy">
            <p class="kicker">${escapeHtml(item.n)}</p>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.note)}</p>
            <p><code>${escapeHtml(item.image)}</code></p>
          </div>
        </section>
      `;
    }

    document.getElementById("characters").innerHTML = characters.map(render).join("");
    document.getElementById("scenes").innerHTML = scenes.map(render).join("");
  </script>
</body>
</html>
