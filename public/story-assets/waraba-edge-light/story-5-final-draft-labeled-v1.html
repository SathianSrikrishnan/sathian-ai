  <style>
    :root {
      color-scheme: dark;
      --bg: #080b11;
      --ink: #fff8ef;
      --muted: #d7c8b1;
      --line: rgba(255, 255, 255, 0.14);
      --panel: rgba(18, 24, 31, 0.82);
      --accent: #f0b766;
      --amber: #ffd089;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(185, 122, 50, 0.16), transparent 34rem),
        linear-gradient(180deg, #0b1020 0%, var(--bg) 42%, #090806 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }

    header, main {
      max-width: 1180px;
      margin: 0 auto;
      padding-inline: 22px;
    }

    header {
      padding-top: 56px;
      padding-bottom: 28px;
    }

    h1 {
      margin: 0 0 12px;
      max-width: 900px;
      font-size: clamp(38px, 7vw, 86px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .dek {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 20px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #f4dfbf;
    }

    .meta span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(255, 255, 255, 0.045);
    }

    main { padding-bottom: 80px; }

    .scene {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(290px, 0.92fr);
      gap: 22px;
      align-items: center;
      padding: 26px 0;
      border-top: 1px solid var(--line);
    }

    .frame {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
      border-radius: 10px;
      background: #111827;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.25);
    }

    .frame img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 82vh;
      object-fit: contain;
      background: #111827;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 10px;
      background: var(--panel);
      padding: 24px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .kicker {
      margin: 0 0 9px;
      color: var(--accent);
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 12px;
      font-size: 19px;
    }

    p:last-child { margin-bottom: 0; }

    .quote { color: var(--amber); }

    .cover-title {
      color: var(--amber);
      font-size: 24px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      .scene { grid-template-columns: 1fr; }
      .copy { padding: 20px; }
    }
  </style>
</head>

  </header>

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char];
      });
    }

    function isQuote(line) {
      return /^".*"$/.test(line) || line.indexOf('"') >= 0;
    }

    function renderLine(line, sceneNumber, index) {
      const cls = sceneNumber === "01" && index === 0 ? ' class="cover-title"' : (isQuote(line) ? ' class="quote"' : '');
      return '<p' + cls + '>' + escapeHtml(line) + '</p>';
    }

    function renderScene(scene) {
      const lines = scene.lines.map(function(line, index) { return renderLine(line, scene.n, index); }).join('');
      const heading = scene.n === "01" ? '' : '<h2>' + escapeHtml(scene.title) + '</h2>';
      return '<section class="scene" id="scene-' + scene.n + '">' +
        '<div class="frame"><img src="' + escapeHtml(scene.image) + '" alt="' + escapeHtml(scene.n + '. ' + scene.title) + '" loading="lazy" /></div>' +
        '<div class="copy"><p class="kicker">' + escapeHtml(scene.n + '. ' + scene.title) + '</p>' + heading + lines + '</div>' +
        '</section>';
    }

    document.getElementById("story").innerHTML = scenes.map(renderScene).join('');
  </script>
</body>
</html>
