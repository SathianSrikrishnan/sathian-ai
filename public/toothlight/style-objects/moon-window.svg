      <stop offset="0" stop-color="#0d2234"/>
      <stop offset=".5" stop-color="#6eb7ee"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
