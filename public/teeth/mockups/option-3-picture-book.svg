<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- OPTION 3: PICTURE BOOK ILLUSTRATION STYLE -->
  <!-- Inspired by: Oliver Jeffers, Jon Klassen, "Lost and Found" -->
  <!-- Watercolor textures, pencil marks, simple dot eyes, lots of white space -->
  <!-- Dreamy, soft, narrative quality - like a page from a beloved book -->

  <defs>
    <!-- Watercolor texture filter -->
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Soft pencil/sketch edge -->
    <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>

    <!-- Watercolor wash gradients -->
    <linearGradient id="softPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDDE1;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#FFB5C5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFA5B5;stop-opacity:0.4"/>
    </linearGradient>

    <linearGradient id="softBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8F4F8;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C5E3F0;stop-opacity:0.3"/>
    </linearGradient>

    <linearGradient id="warmCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9F0"/>
      <stop offset="100%" style="stop-color:#FFF5E6"/>
    </linearGradient>
  </defs>

  <!-- Background - cream paper with subtle watercolor wash -->
  <rect width="500" height="500" fill="#FFFEF8"/>

  <!-- Soft blue watercolor cloud/wash in corner -->
  <ellipse cx="420" cy="80" rx="120" ry="80" fill="url(#softBlue)" filter="url(#watercolor)"/>
  <ellipse cx="60" cy="450" rx="100" ry="70" fill="url(#softBlue)" filter="url(#watercolor)" opacity="0.5"/>

  <!-- Hand-written title (like Oliver Jeffers) -->
  <text x="250" y="55" text-anchor="middle" font-family="Georgia, Times, serif" font-size="28" font-style="italic" fill="#5D4E37" opacity="0.9">
    my teeth
  </text>
  <!-- Pencil underline -->
  <path d="M160 62 Q250 68, 340 62" stroke="#5D4E37" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Upper teeth area - soft pink watercolor gum -->
  <path
    d="M100 150
       Q100 110, 180 100
       Q250 95, 320 100
       Q400 110, 400 150
       Q400 180, 320 190
       Q250 195, 180 190
       Q100 180, 100 150"
    fill="url(#softPink)"
    filter="url(#watercolor)"
    opacity="0.7"
  />

  <!-- UPPER TEETH - Oliver Jeffers style: simple shapes, dot eyes, thin lines -->

  <!-- Tooth 1 -->
  <g transform="translate(115, 115)">
    <rect width="28" height="55" rx="8" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <!-- Simple dot eyes -->
    <circle cx="10" cy="22" r="2" fill="#3D3D3D"/>
    <circle cx="18" cy="22" r="2" fill="#3D3D3D"/>
    <!-- Thin line smile -->
    <path d="M9 34 Q14 40, 19 34" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 2 -->
  <g transform="translate(150, 108)">
    <rect width="26" height="60" rx="7" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="9" cy="24" r="2" fill="#3D3D3D"/>
    <circle cx="17" cy="24" r="2" fill="#3D3D3D"/>
    <path d="M8 36 Q13 42, 18 36" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 3 -->
  <g transform="translate(183, 103)">
    <rect width="24" height="65" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="26" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="26" r="2" fill="#3D3D3D"/>
    <path d="M7 38 Q12 44, 17 38" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 4 -->
  <g transform="translate(214, 100)">
    <rect width="24" height="68" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="28" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="28" r="2" fill="#3D3D3D"/>
    <path d="M7 40 Q12 46, 17 40" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 5 (lost - empty space with story) -->
  <g transform="translate(245, 98)">
    <!-- Empty gap - just pencil outline showing where tooth was -->
    <rect width="24" height="70" rx="6" fill="none" stroke="#A0937D" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
    <!-- Little sprout (simple, childlike) -->
    <path d="M12 50 Q10 35, 12 25" stroke="#7BA05B" stroke-width="2" fill="none"/>
    <ellipse cx="7" cy="32" rx="5" ry="3" fill="#9DC183" transform="rotate(-20, 7, 32)"/>
    <ellipse cx="17" cy="28" rx="5" ry="3" fill="#9DC183" transform="rotate(20, 17, 28)"/>
    <!-- Tiny tooth emerging (simple circle) -->
    <ellipse cx="12" cy="20" rx="5" ry="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1"/>
    <!-- Hand-drawn star -->
    <text x="26" y="15" font-family="Georgia" font-size="14" fill="#F5D76E">✦</text>
  </g>

  <!-- Tooth 6 -->
  <g transform="translate(276, 100)">
    <rect width="24" height="68" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="28" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="28" r="2" fill="#3D3D3D"/>
    <path d="M7 40 Q12 46, 17 40" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 7 -->
  <g transform="translate(307, 103)">
    <rect width="24" height="65" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="26" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="26" r="2" fill="#3D3D3D"/>
    <path d="M7 38 Q12 44, 17 38" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 8 -->
  <g transform="translate(338, 108)">
    <rect width="26" height="60" rx="7" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="9" cy="24" r="2" fill="#3D3D3D"/>
    <circle cx="17" cy="24" r="2" fill="#3D3D3D"/>
    <path d="M8 36 Q13 42, 18 36" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Tooth 9 (wiggly - simple tilt and expression change) -->
  <g transform="translate(371, 115) rotate(-5)">
    <rect width="28" height="55" rx="8" fill="#FFF9E6" stroke="#D4A037" stroke-width="1.5" filter="url(#sketchy)"/>
    <!-- Eyes looking nervous (just dots but positioned differently) -->
    <circle cx="10" cy="20" r="2" fill="#3D3D3D"/>
    <circle cx="18" cy="20" r="2" fill="#3D3D3D"/>
    <!-- Small eyebrow lines -->
    <path d="M7 16 L13 18" stroke="#3D3D3D" stroke-width="1"/>
    <path d="M21 18 L15 16" stroke="#3D3D3D" stroke-width="1"/>
    <!-- Wobbly worried mouth -->
    <path d="M9 32 Q11 30, 14 32 Q17 34, 19 32" stroke="#3D3D3D" stroke-width="1" fill="none"/>
    <!-- Hand-drawn wobble marks -->
    <path d="M-3 20 L-8 20" stroke="#D4A037" stroke-width="1" opacity="0.7"/>
    <path d="M-3 30 L-8 30" stroke="#D4A037" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Soft dividing space -->
  <text x="250" y="210" text-anchor="middle" font-family="Georgia" font-size="12" font-style="italic" fill="#A0937D" opacity="0.6">
    · · ·
  </text>

  <!-- Lower teeth area - soft pink watercolor -->
  <path
    d="M100 290
       Q100 260, 180 255
       Q250 250, 320 255
       Q400 260, 400 290
       Q400 320, 320 330
       Q250 335, 180 330
       Q100 320, 100 290"
    fill="url(#softPink)"
    filter="url(#watercolor)"
    opacity="0.7"
  />

  <!-- LOWER TEETH - same simple style -->

  <g transform="translate(115, 265)">
    <rect width="28" height="50" rx="8" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="10" cy="28" r="2" fill="#3D3D3D"/>
    <circle cx="18" cy="28" r="2" fill="#3D3D3D"/>
    <path d="M9 16 Q14 10, 19 16" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(150, 258)">
    <rect width="26" height="55" rx="7" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="9" cy="30" r="2" fill="#3D3D3D"/>
    <circle cx="17" cy="30" r="2" fill="#3D3D3D"/>
    <path d="M8 18 Q13 12, 18 18" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(183, 252)">
    <rect width="24" height="60" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="34" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="34" r="2" fill="#3D3D3D"/>
    <path d="M7 20 Q12 14, 17 20" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(214, 248)">
    <rect width="24" height="64" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="38" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="38" r="2" fill="#3D3D3D"/>
    <path d="M7 22 Q12 16, 17 22" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(245, 246)">
    <rect width="24" height="66" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="40" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="40" r="2" fill="#3D3D3D"/>
    <path d="M7 24 Q12 18, 17 24" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(276, 246)">
    <rect width="24" height="66" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="40" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="40" r="2" fill="#3D3D3D"/>
    <path d="M7 24 Q12 18, 17 24" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(307, 248)">
    <rect width="24" height="64" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="38" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="38" r="2" fill="#3D3D3D"/>
    <path d="M7 22 Q12 16, 17 22" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(338, 252)">
    <rect width="24" height="60" rx="6" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="8" cy="34" r="2" fill="#3D3D3D"/>
    <circle cx="16" cy="34" r="2" fill="#3D3D3D"/>
    <path d="M7 20 Q12 14, 17 20" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(369, 258)">
    <rect width="26" height="55" rx="7" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="9" cy="30" r="2" fill="#3D3D3D"/>
    <circle cx="17" cy="30" r="2" fill="#3D3D3D"/>
    <path d="M8 18 Q13 12, 18 18" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <g transform="translate(402, 265)">
    <rect width="28" height="50" rx="8" fill="#FFFEF8" stroke="#A0937D" stroke-width="1.5" filter="url(#sketchy)"/>
    <circle cx="10" cy="28" r="2" fill="#3D3D3D"/>
    <circle cx="18" cy="28" r="2" fill="#3D3D3D"/>
    <path d="M9 16 Q14 10, 19 16" stroke="#3D3D3D" stroke-width="1" fill="none"/>
  </g>

  <!-- Story text at bottom (like a picture book page) -->
  <text x="250" y="380" text-anchor="middle" font-family="Georgia, Times, serif" font-size="14" font-style="italic" fill="#5D4E37" opacity="0.8">
    "each tooth has a story to tell"
  </text>

  <!-- Small fairy sketch in corner (very simple, Oliver Jeffers style) -->
  <g transform="translate(420, 400)">
    <!-- Simple body (just a dress shape) -->
    <path d="M0 25 Q-8 15, 0 0 Q8 15, 0 25" fill="#FFDDE1" stroke="#A0937D" stroke-width="1"/>
    <!-- Head (simple circle) -->
    <circle cx="0" cy="-8" r="8" fill="#FFF5E6" stroke="#A0937D" stroke-width="1"/>
    <!-- Dot eyes -->
    <circle cx="-3" cy="-9" r="1" fill="#3D3D3D"/>
    <circle cx="3" cy="-9" r="1" fill="#3D3D3D"/>
    <!-- Tiny smile -->
    <path d="M-2 -5 Q0 -3, 2 -5" stroke="#3D3D3D" stroke-width="0.5" fill="none"/>
    <!-- Simple wings (just curved lines) -->
    <path d="M5 5 Q15 -5, 8 -15" stroke="#C5E3F0" stroke-width="1.5" fill="none"/>
    <path d="M-5 5 Q-15 -5, -8 -15" stroke="#C5E3F0" stroke-width="1.5" fill="none"/>
    <!-- Wand (simple line with star) -->
    <line x1="8" y1="10" x2="18" y2="-5" stroke="#A0937D" stroke-width="1"/>
    <text x="20" y="-8" font-family="Georgia" font-size="10" fill="#F5D76E">✦</text>
  </g>

  <!-- Hand-written note -->
  <text x="400" y="460" text-anchor="middle" font-family="Georgia" font-size="10" font-style="italic" fill="#A0937D" opacity="0.6">
    ~ the tooth fairy
  </text>

  <!-- Page number (like a real book) -->
  <text x="250" y="485" text-anchor="middle" font-family="Georgia" font-size="10" fill="#A0937D" opacity="0.4">
    1
  </text>

</svg>
