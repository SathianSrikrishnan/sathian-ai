<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Storybook-style tooth with soft, hand-drawn aesthetic -->

  <!-- Subtle paper texture background (implied through color) -->
  <defs>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#D4A59A" flood-opacity="0.3"/>
    </filter>

    <!-- Warm gradient for tooth -->
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFEF5"/>
      <stop offset="50%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </linearGradient>

    <!-- Blush gradient -->
    <radialGradient id="blushGradient">
      <stop offset="0%" style="stop-color:#FFB5BA;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFB5BA;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Main tooth body - organic, hand-drawn feel with slight imperfection -->
  <path
    d="M50 8
       C35 8, 22 18, 20 35
       C18 48, 22 60, 28 75
       C30 82, 32 95, 35 105
       C37 112, 43 115, 45 108
       C47 100, 48 88, 50 80
       C52 88, 53 100, 55 108
       C57 115, 63 112, 65 105
       C68 95, 70 82, 72 75
       C78 60, 82 48, 80 35
       C78 18, 65 8, 50 8 Z"
    fill="url(#toothGradient)"
    stroke="#C9B8A8"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- Subtle crown line detail -->
  <path
    d="M30 38 C38 42, 50 44, 62 42 C70 40, 72 38, 70 36"
    fill="none"
    stroke="#E8D5C4"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- Kawaii face elements - soft, gentle -->

  <!-- Left eye - closed happy arc -->
  <path
    d="M38 45 C40 40, 46 40, 48 45"
    fill="none"
    stroke="#6B5B4F"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Right eye - closed happy arc -->
  <path
    d="M52 45 C54 40, 60 40, 62 45"
    fill="none"
    stroke="#6B5B4F"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Small eyelashes (optional flourish) -->
  <path d="M36 43 L34 40" stroke="#6B5B4F" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M64 43 L66 40" stroke="#6B5B4F" stroke-width="1" stroke-linecap="round" opacity="0.5"/>

  <!-- Rosy cheeks - left -->
  <ellipse cx="32" cy="52" rx="6" ry="4" fill="url(#blushGradient)"/>

  <!-- Rosy cheeks - right -->
  <ellipse cx="68" cy="52" rx="6" ry="4" fill="url(#blushGradient)"/>

  <!-- Gentle smile -->
  <path
    d="M42 58 C46 64, 54 64, 58 58"
    fill="none"
    stroke="#C9857A"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Tiny sparkle/star detail -->
  <g transform="translate(72, 20)" opacity="0.7">
    <path d="M0 -4 L0 4 M-4 0 L4 0" stroke="#F5D76E" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-2.5 -2.5 L2.5 2.5 M-2.5 2.5 L2.5 -2.5" stroke="#F5D76E" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>