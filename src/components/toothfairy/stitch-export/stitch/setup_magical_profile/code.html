</div>

<main class="flex-1 mt-20 px-6 pb-24 max-w-[375px] mx-auto w-full">

<div class="mb-8">
<div class="flex justify-between items-end mb-2">

<span class="font-label text-[10px] uppercase tracking-widest text-secondary">Profile Setup</span>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/5 relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_8px_#fff]"></div>
</div>
</div>
</div>
<!-- Hero Header -->
<div class="mb-10">
<h2 class="font-headline text-3xl font-extrabold text-primary leading-tight mb-2">Who is the magic for?</h2>
<p class="font-body text-sm text-on-surface-variant/80">Every child's journey is unique. Let's create their special portal to the Tooth Fairy.</p>
</div>

<div class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center border-2 border-primary-container/40 photo-glow cursor-pointer hover:border-primary-container transition-all active:scale-95 duration-200 overflow-hidden relative"><img alt="Tanda fairy mascot" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0uhFSygYypPStZ4CcHdqadmJWZzePIM2uv3rUMrzK4xgHgG7L5d3CmlBfA2hCoS9E-6DPd4B03NfZxb5Cc4HVI30Z_gm4kUKD4iwOgTxeayXbwndZs1hoHkKOYu3x0mq3AxVwpO9w_S62i2HJGhUCaPG58lp-ftqg8cPVlmvyLnFowbICbWUBuezdk6gtVaDuNf9w4aHhPHUnLiBfx1azU_6MAoYwXFoEtDe5uIeLViyRTggF2p-TLctCyH5Tb--D6jbH7rp62HGmQ"/>

</div>
<span class="mt-4 font-label text-[10px] uppercase tracking-widest text-outline">Upload a photo</span>
</div>

<div class="space-y-6">
<!-- Name Input -->
<div class="bg-surface-variant/20 backdrop-blur-xl p-6 rounded-2xl border border-outline-variant/15">
<div class="flex flex-col gap-1">
<label class="font-label text-[10px] uppercase tracking-widest text-outline ml-1" for="child-name">Child's Name</label>
<input class="bg-transparent border-0 border-b border-outline-variant/30 focus:border-secondary focus:ring-0 text-on-surface placeholder:text-outline-variant py-2 px-1 font-body text-lg transition-colors" id="child-name" placeholder="e.g. Luna Star" type="text"/>
</div>
</div>
<!-- Date of Birth Input -->
<div class="bg-surface-variant/20 backdrop-blur-xl p-6 rounded-2xl border border-outline-variant/15">
<div class="flex flex-col gap-1 relative">
<label class="font-label text-[10px] uppercase tracking-widest text-outline ml-1" for="child-dob">Date of Birth</label>
<div class="flex items-center">
<input class="bg-transparent border-0 border-b border-outline-variant/30 focus:border-secondary focus:ring-0 text-on-surface py-2 px-1 font-body text-lg w-full appearance-none transition-colors" id="child-dob" type="date"/>
<span class="material-symbols-outlined absolute right-1 bottom-3 text-primary-fixed-dim pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
</div>

<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
</button>

<p class="font-body text-xs text-outline-variant/60">Step 1: Identity &amp; Spark</p>
