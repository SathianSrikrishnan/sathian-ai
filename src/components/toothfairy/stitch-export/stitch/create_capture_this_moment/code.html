<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-bright": "#333850",
            "primary-fixed": "#ffdf98",
            "secondary-fixed": "#79f7ea",
            "on-tertiary-fixed": "#350e11",
            "on-error-container": "#ffdad6",
            "tertiary-fixed": "#ffdad9",
            "on-surface": "#dde1ff",
            "surface-container-high": "#242940",
            "tertiary": "#ffdede",
            "on-primary-container": "#6b5100",
            "primary-container": "#f0c456",
            "secondary-fixed-dim": "#5adace",
            "background": "#0d1228",
            "on-error": "#690005",
            "on-secondary-fixed-variant": "#00504a",
            "primary": "#ffe3a5",
            "on-primary-fixed": "#251a00",
            "inverse-surface": "#dde1ff",
            "secondary-container": "#01a89d",
            "tertiary-fixed-dim": "#fbb5b5",
            "surface-tint": "#edc153",
            "on-tertiary": "#4f2324",
            "inverse-on-surface": "#2a2f47",
            "surface-container-highest": "#2f334b",
            "surface-container-lowest": "#080d22",
            "error-container": "#93000a",
            "surface-variant": "#2f334b",
            "on-secondary-fixed": "#00201d",
            "surface-dim": "#0d1228",
            "on-tertiary-container": "#7b4647",
            "on-secondary": "#003733",
            "on-background": "#dde1ff",
            "on-surface-variant": "#d1c5b0",
            "inverse-primary": "#775a00",
            "primary-fixed-dim": "#edc153",
            "on-primary": "#3e2e00",
            "tertiary-container": "#ffb8b8",
            "surface-container": "#191e35",
            "on-primary-fixed-variant": "#5a4300",
            "on-secondary-container": "#003531",
            "surface": "#0d1228",
            "error": "#ffb4ab",
            "outline-variant": "#4e4636",
            "outline": "#9a907c",
            "secondary": "#5adace",
            "surface-container-low": "#151a31",
            "on-tertiary-fixed-variant": "#6a3839"
          },
          fontFamily: {
            "headline": ["Plus Jakarta Sans"],
            "body": ["Manrope"],
            "label": ["Manrope"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .stardust-bg {
      background: radial-gradient(circle at 50% 50%, #1a1040 0%, #0d1228 100%);
    }
    .glass-card {
      background: rgba(47, 51, 75, 0.4);
      backdrop-filter: blur(12px);
    }
    .firefly-glow {
      box-shadow: 0 0 15px rgba(90, 218, 206, 0.3);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0d1228] dark:bg-[#0d1228] bg-gradient-to-b from-[#151a31] to-transparent">
<div class="flex items-center gap-4">
<button class="text-[#f0c456] dark:text-[#f0c456] active:scale-95 duration-200 transition-opacity hover:opacity-80">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] text-lg font-bold tracking-tight text-[#f0c456] drop-shadow-[0_0_8px_rgba(240,196,86,0.4)]">Tooth Fairy Network</h1>
</div>
<div class="w-8 h-8 rounded-full border border-outline-variant overflow-hidden">
<img alt="Fairy Avatar" data-alt="close up of a friendly whimsical tooth fairy with shimmering wings and a golden crown against a starlit purple background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYC_3WvKx-L1yf886JsABtKTaktRtW4kbp0TAek-Wt7BhrubUTPQtTpoWOn0G-I7relqqFxCisY12t3vG9L02bCOH4biF5v_5MV4Hq1v7iVOsC47B8vRFQqNrDiVXMPr_Rm3Pg-0qpLfvp0GuFF2JV_uQzzoX8D-iO1r9FpB6flIgqNqXx4l6AomUZ1lrcu4tLxMKnanPwZqNjXdjh7ZH6x9ReZS7rfgEM27P5_9XIxBQuhjLoraCU6JTHKYwT3ih91vtXxOEHf9Y"/>
</div>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-[375px] pt-24 pb-32 px-6 flex flex-col gap-8 stardust-bg min-h-screen">
<!-- Progress & Header -->
<section class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<h2 class="font-headline text-2xl font-bold tracking-tight text-primary">Capture This Moment</h2>
<span class="font-label text-xs font-bold text-secondary uppercase tracking-[0.2em]">Step 2 of 5</span>
</div>
<!-- Treasure Progress Bar -->
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute h-full bg-secondary w-2/5 rounded-full firefly-glow">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_8px_#fff]"></div>
</div>
</div>
</section>
<!-- Milestone Selector -->
<section class="flex flex-col gap-4">
<h3 class="font-label text-[10px] uppercase tracking-widest text-outline">Select Milestone</h3>
<div class="grid grid-cols-3 gap-3">
<!-- Card: First Tooth -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl glass-card border border-outline-variant/15 active:scale-95 transition-all">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="child_care">child_care</span>
</div>
<span class="font-label text-[10px] font-bold text-on-surface-variant text-center leading-tight">First Tooth</span>
</button>
<!-- Card: Lost Tooth (Active) -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-high border-2 border-primary/40 firefly-glow scale-105 transition-all">
<div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="kid_star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">kid_star</span>
</div>
<span class="font-label text-[10px] font-bold text-primary text-center leading-tight">Lost Tooth</span>
</button>
<!-- Card: Fairy Visit -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl glass-card border border-outline-variant/15 active:scale-95 transition-all">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-xl" data-icon="auto_fix_high">auto_fix_high</span>
</div>
<span class="font-label text-[10px] font-bold text-on-surface-variant text-center leading-tight">Fairy Visit</span>
</button>
</div>
</section>
<!-- Drawing Canvas -->
<section class="flex flex-col gap-4">
<div class="flex justify-between items-center">
<h3 class="font-label text-[10px] uppercase tracking-widest text-outline">Leave a Note for the Fairy</h3>
<span class="material-symbols-outlined text-secondary text-sm" data-icon="draw">draw</span>
</div>
<div class="relative w-full aspect-square rounded-[2rem] bg-surface-container-low border-2 border-dashed border-outline-variant/30 flex flex-col items-center justify-center gap-3 group">
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDcdyeWww5XsZkL9v7WOCuNqfTfUOvwdmyMIyqvbx7veWoABgFPLcfjm0e1Tx0UYAfO4hgv5S0Oi08gJ-uv_GzHG9yy6Q9dKiKFQozr12PlGit02BYpcG-TMrsIYwHdyMA4NEJicQfeDWsP5eBtvt1kkVv-3JsXSFkue29PNk8AJ8q1QvsZIecwBn-5VUT-uUTPZLMiuZOoHnvsdVFarS6lC4V5SJ2T10efYhQHBM4_034kZwfLyd5GksvPav1fq3SELcgDZa024JQ');"></div>
<span class="material-symbols-outlined text-4xl text-outline-variant" data-icon="edit_note">edit_note</span>
<p class="font-body text-sm text-outline">Draw here</p>
<!-- Decoration Fireflies -->
<div class="absolute top-4 left-8 w-1 h-1 bg-secondary rounded-full firefly-glow animate-pulse"></div>
<div class="absolute bottom-12 right-10 w-1.5 h-1.5 bg-primary rounded-full firefly-glow animate-pulse delay-700"></div>
</div>
</section>
<!-- Action Bar -->
<section class="flex flex-col gap-4 mt-auto">
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-bold flex items-center justify-center gap-3 shadow-[0_10px_30px_rgba(240,196,86,0.3)] active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="photo_camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
        Capture Photo
      </button>
<button class="w-full h-12 rounded-full glass-card border border-primary/15 text-primary-fixed-dim font-medium flex items-center justify-center gap-2 active:scale-95 transition-transform">
        Upload from Gallery
      </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#2f334b]/60 dark:bg-[#2f334b]/60 rounded-t-[2rem] backdrop-blur-2xl border-t border-[#4e4636]/15 shadow-[0_-20px_40px_rgba(0,0,0,0.4)]">
<div class="flex flex-col items-center justify-center text-[#9ca3af] hover:text-[#ffe3a5] transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-[#f0c456] drop-shadow-[0_0_10px_rgba(90,218,206,0.2)] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="auto_awesome_motion" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome_motion</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Gallery</span>
</div>
<div class="flex flex-col items-center justify-center text-[#9ca3af] hover:text-[#ffe3a5] transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Settings</span>
</div>
</nav>
</body></html>
