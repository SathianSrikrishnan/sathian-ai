<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

              "inverse-on-surface": "#2a2f47",
              "surface": "#0d1228",
              "primary": "#ffe3a5",
              "on-surface": "#dde1ff",
              "secondary-fixed": "#79f7ea",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(47, 51, 75, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .stardust-gradient {
            background: linear-gradient(135deg, #ffe3a5 0%, #f0c456 100%);
        }
        .firefly-glow {
            box-shadow: 0 0 15px rgba(90, 218, 206, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body min-h-screen pb-32">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0d1228] bg-gradient-to-b from-[#151a31] to-transparent">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden outline-variant/15 outline outline-1">
<img class="w-full h-full object-cover" data-alt="Stylized magical child avatar with soft glowing wings and golden aura in a deep blue sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-GJYy3Ah6TRxNi8-gmpJA6T02p8axPp2A9VLvlQsC6DU9TGqVSrL6Jv3rV9EIMvzNThRtuCEeYJ5fgb1758w-G2ZYJDgYlmNiUjsO46pdR7nuSFAf1IYCxF_1cjQ3XvFjLpXiBXqgsOYnZ-il14cjzGK-YxIX7--8W3lyxNLaRBJjhc07Wt4aTQBXSA286oGl-CKspreuCWM_f7SkxqDN6bfI32d6GFNPlyCz7LDq4xbPxRF0PM3pQym5MTfQ1kh0yvp2-1A_4EM"/>
</div>
<h1 class="font-headline font-bold tracking-tight text-xl text-[#f0c456] tracking-tighter">Tooth Fairy Ledger</h1>
</div>
<button class="text-[#f0c456] active:scale-95 duration-200 transition-opacity hover:opacity-80">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="pt-24 px-6 space-y-8">
<!-- Hero Section -->
<section class="space-y-2">
<h2 class="font-headline text-[1.75rem] font-bold leading-tight tracking-tight text-primary">
                The More Fairies,<br/>The Merrier
            </h2>
<p class="text-on-surface-variant text-sm max-w-[280px]">
                Invite your magical circle to contribute to the celestial vault and keep the tradition alive.
            </p>
</section>
<!-- Glassmorphism Share Card -->
<section class="glass-card rounded-xl p-6 border border-outline-variant/15 space-y-4">
<div class="flex items-center justify-between">
<span class="font-label text-[10px] uppercase tracking-widest text-[#9ca3af]">Your Magic Link</span>
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex items-center gap-3 bg-surface-container-lowest rounded-lg p-3 border border-outline-variant/10">
<code class="text-xs text-primary-fixed-dim truncate flex-1">fairy.ledger/v/aura-8821</code>
<button class="flex items-center justify-center bg-surface-variant w-8 h-8 rounded-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm text-primary">content_copy</span>
</button>
</div>
</section>
<!-- Role Selection -->
<section class="space-y-4">
<h3 class="font-label text-[10px] uppercase tracking-widest text-[#9ca3af] px-1">Assign a Fairy Role</h3>
<div class="grid grid-cols-1 gap-3">
<!-- Grandparent -->
<button class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary border border-outline-variant/10">
<span class="material-symbols-outlined" data-icon="castle">castle</span>
</div>
<div class="text-left">
<div class="font-bold text-on-surface text-sm">Grandparent</div>
<div class="text-[11px] text-on-surface-variant">The Keeper of Stories</div>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Aunt/Uncle -->
<button class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary border border-outline-variant/10">
<span class="material-symbols-outlined" data-icon="forest">forest</span>
</div>
<div class="text-left">
<div class="font-bold text-on-surface text-sm">Aunt/Uncle</div>
<div class="text-[11px] text-on-surface-variant">The Merchant of Mischief</div>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Godparent -->
<button class="flex items-center justify-between p-4 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-secondary border border-outline-variant/10">
<span class="material-symbols-outlined" data-icon="magic_button">magic_button</span>
</div>
<div class="text-left">
<div class="font-bold text-on-surface text-sm">Godparent</div>
<div class="text-[11px] text-on-surface-variant">The Eternal Guardian</div>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Existing Depositors -->
<section class="space-y-4">
<h3 class="font-label text-[10px] uppercase tracking-widest text-[#9ca3af] px-1">Active Depositors</h3>
<div class="space-y-0.5 overflow-hidden rounded-xl bg-surface-container-low border border-outline-variant/10">
<div class="flex items-center justify-between p-4 bg-surface-container-high/40">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-gradient-to-br from-secondary/20 to-secondary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-lg" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<span class="text-sm font-medium text-on-surface">Grandma Rose</span>
</div>
<span class="text-sm font-bold text-primary tracking-tight">0.5 SOL</span>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-high/40">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-gradient-to-br from-secondary/20 to-secondary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-lg" style="font-variation-settings: 'FILL' 1;">stars</span>
</div>
<span class="text-sm font-medium text-on-surface">Uncle Ben</span>
</div>
<span class="text-sm font-bold text-primary tracking-tight">0.2 SOL</span>
</div>
</div>
</section>
<!-- CTA Action -->
<div class="pt-4">
<button class="stardust-gradient w-full py-4 rounded-xl font-headline font-extrabold text-[#3e2e00] text-sm uppercase tracking-widest shadow-[0_20px_40px_rgba(0,0,0,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Share Magic Link</span>
<span class="material-symbols-outlined text-lg" data-icon="send">send</span>
</button>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#151a31]/80 backdrop-blur-xl border-t border-[#4e4636]/15 shadow-[0_-10px_40px_rgba(0,0,0,0.4)] rounded-t-[2rem]">
<button class="flex flex-col items-center justify-center text-[#9ca3af] hover:text-[#5adace] transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-2xl" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Vault</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9ca3af] hover:text-[#5adace] transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-2xl" data-icon="public">public</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Traditions</span>
</button>
<button class="flex flex-col items-center justify-center text-[#9ca3af] hover:text-[#5adace] transition-colors active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-2xl" data-icon="auto_awesome">auto_awesome</span>
<span class="font-['Manrope'] text-[10px] font-medium uppercase tracking-widest mt-1">Mint</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#f0c456] text-[#3e2e00] rounded-full w-12 h-12 shadow-[0_0_15px_rgba(240,196,86,0.3)] active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-2xl" data-icon="group_add">group_add</span>
</button>
</nav>
</body></html>
